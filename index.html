<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>document.documentElement.classList.add('js')</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070D" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- the loader's letters (also the site's display font: same file, fetched once) -->
    <link rel="preload" href="/node_modules/@fontsource/zain/files/zain-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Boot loader: painted with the HTML, before any JS. YOUGOLOUN, each letter jumping in turn
      (Latin letters only — Arabic is never split into letters). src/loader.ts sends it away once the
      page is ready (Home: 3D world drawn), it lifts like a curtain and the hero intro plays.
      Colours: the --p-* palette variables (injected first into <head> by the Vite plugin).
    -->
    <style>
      @font-face {
        font-family: 'Zain';
        src: url('/node_modules/@fontsource/zain/files/zain-latin-700-normal.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
        unicode-range: U+0000-00FF;
      }
      #yg-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, color-mix(in oklab, var(--p-blue-light) 38%, var(--p-paper)) 0%, var(--p-paper) 72%);
        color: var(--p-ink);
        clip-path: inset(0 0 0 0);
        transition: clip-path 0.95s cubic-bezier(0.76, 0, 0.24, 1) 0.28s;
        /* never stuck: if the app can't start, the loader still leaves */
        animation: ygl-safety 0.6s ease 14s forwards;
      }
      #yg-loader .ygl-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 0.5s ease 0.3s;
      }
      #yg-loader .ygl-mark {
        width: clamp(44px, 6vw, 64px);
        height: auto;
        margin-bottom: clamp(18px, 3vh, 28px);
        animation: ygl-bob 1.6s ease-in-out infinite;
        transition: transform 0.6s cubic-bezier(0.5, 0, 0.75, 0), opacity 0.4s ease;
      }
      #yg-loader .ygl-word {
        display: flex;
        direction: ltr;
        font-family: 'Zain', ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(2.6rem, 10vw, 7rem);
        line-height: 1;
        letter-spacing: -0.02em;
        padding-top: 0.5em; /* room for the jumps */
      }
      /* each letter: the outer span keeps the shadow on the floor, the inner one jumps */
      #yg-loader .ygl-l {
        position: relative;
        display: inline-block;
      }
      #yg-loader .ygl-l::after {
        content: '';
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: -0.1em;
        height: 0.07em;
        border-radius: 50%;
        background: var(--p-ink);
        opacity: 0.16;
        animation: ygl-shadow 1.6s cubic-bezier(0.33, 0, 0.3, 1) infinite;
        animation-delay: calc(var(--i) * 95ms);
      }
      #yg-loader .ygl-l > span {
        display: inline-block;
        transform-origin: 50% 100%;
        animation: ygl-jump 1.6s cubic-bezier(0.33, 0, 0.3, 1) infinite;
        animation-delay: calc(var(--i) * 95ms);
      }
      #yg-loader .ygl-l:nth-child(odd) { --c: var(--p-blue-deep); }
      #yg-loader .ygl-l:nth-child(even) { --c: var(--p-green-deep); }
      #yg-loader .ygl-alt {
        margin-top: clamp(14px, 2.2vh, 22px);
        font-family: system-ui, sans-serif;
        font-size: clamp(0.95rem, 1.6vw, 1.15rem);
        opacity: 0.55;
      }
      #yg-loader .ygl-line {
        position: relative;
        width: clamp(90px, 12vw, 140px);
        height: 2px;
        margin-top: clamp(18px, 3vh, 28px);
        overflow: hidden;
        border-radius: 2px;
        background: color-mix(in oklab, var(--p-ink) 10%, transparent);
      }
      #yg-loader .ygl-line::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: var(--p-gradient-brand);
        animation: ygl-slide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes ygl-jump {
        0%, 56%, 100% { transform: translateY(0) scale(1, 1); color: var(--p-ink); }
        8% { transform: translateY(0) scale(1.07, 0.9); }
        23% { transform: translateY(-0.42em) scale(0.95, 1.07); color: var(--c); }
        37% { transform: translateY(0) scale(1.09, 0.87); color: var(--c); }
        47% { transform: translateY(0) scale(0.98, 1.02); }
      }
      @keyframes ygl-shadow {
        0%, 56%, 100% { transform: scaleX(1); opacity: 0.16; }
        23% { transform: scaleX(0.45); opacity: 0.06; }
        37% { transform: scaleX(1.15); opacity: 0.2; }
      }
      @keyframes ygl-bob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-3deg); }
      }
      @keyframes ygl-slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(240%); }
      }
      @keyframes ygl-safety {
        to { opacity: 0; visibility: hidden; }
      }
      /* leaving: the letters leap off one after another, then the curtain lifts */
      #yg-loader.ygl-out {
        clip-path: inset(0 0 100% 0);
        pointer-events: none;
      }
      #yg-loader.ygl-out .ygl-l > span {
        animation: ygl-exit 0.55s cubic-bezier(0.5, 0, 0.75, 0) forwards;
        animation-delay: calc(var(--i) * 35ms);
      }
      #yg-loader.ygl-out .ygl-l::after,
      #yg-loader.ygl-out .ygl-line,
      #yg-loader.ygl-out .ygl-alt { opacity: 0; transition: opacity 0.3s ease; }
      #yg-loader.ygl-out .ygl-mark { transform: translateY(-40px) scale(0.7); opacity: 0; }
      @keyframes ygl-exit {
        to { transform: translateY(-1.1em) scale(0.9, 1.1); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #yg-loader { transition: opacity 0.6s ease; }
        #yg-loader.ygl-out { clip-path: inset(0 0 0 0); opacity: 0; }
        #yg-loader .ygl-mark, #yg-loader .ygl-l::after, #yg-loader .ygl-line::after { animation: none; }
        #yg-loader .ygl-l > span,
        #yg-loader.ygl-out .ygl-l > span {
          animation: ygl-pulse 1.6s ease-in-out infinite;
          animation-delay: calc(var(--i) * 95ms);
        }
        @keyframes ygl-pulse {
          0%, 100% { opacity: 1; }
          30% { opacity: 0.35; }
        }
      }
    </style>
  </head>
  <body>
    <div id="yg-loader" aria-hidden="true">
      <div class="ygl-box">
        <svg class="ygl-mark" viewBox="0 0 40 36" width="64" height="58">
          <defs>
            <linearGradient id="ygl-b" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color: var(--p-blue-light)" />
              <stop offset="1" style="stop-color: var(--p-blue-deep)" />
            </linearGradient>
            <linearGradient id="ygl-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color: var(--p-green-light)" />
              <stop offset="1" style="stop-color: var(--p-green-deep)" />
            </linearGradient>
          </defs>
          <path d="M19 9h12a7 7 0 0 1 7 7v7a7 7 0 0 1-7 7h-1l1 5-6-5h-6a7 7 0 0 1-7-7v-7a7 7 0 0 1 7-7z" fill="url(#ygl-g)" />
          <path d="M8 1h14a7 7 0 0 1 7 7v8a7 7 0 0 1-7 7H11l-7 6 1.5-6.3A7 7 0 0 1 1 16V8a7 7 0 0 1 7-7z" fill="url(#ygl-b)" />
          <rect x="12.6" y="5" width="4.8" height="9" rx="2.4" fill="#fff" />
          <path d="M10.6 11.5a4.4 4.4 0 0 0 8.8 0M15 16v2.4" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" />
        </svg>
        <div class="ygl-word" lang="en">
          <span class="ygl-l" style="--i: 0"><span>Y</span></span><span class="ygl-l" style="--i: 1"><span>O</span></span><span class="ygl-l" style="--i: 2"><span>U</span></span><span class="ygl-l" style="--i: 3"><span>G</span></span><span class="ygl-l" style="--i: 4"><span>O</span></span><span class="ygl-l" style="--i: 5"><span>L</span></span><span class="ygl-l" style="--i: 6"><span>O</span></span><span class="ygl-l" style="--i: 7"><span>U</span></span><span class="ygl-l" style="--i: 8"><span>N</span></span>
        </div>
        <div class="ygl-alt" lang="ar">يقولون</div>
        <div class="ygl-line"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
